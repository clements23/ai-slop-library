name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON data files
        run: |
          python3 - <<'EOF'
          import json, glob
          for path in sorted(glob.glob('data/*.json')):
              with open(path) as f:
                  data = json.load(f)
              items = data.get('fingerprint') or data.get('words') or data.get('phrases') or data.get('openers') or data.get('structures') or data.get('punctuation') or []
              for it in items:
                  if it.get('severity') not in ('critical', 'high', 'medium', 'low'):
                      raise SystemExit(f"bad severity in {path}: {it}")
              print(f"{path}: ok ({len(items)} items)")
          print("ALL VALID")
          EOF

      - name: slopcheck flags sloppy example
        run: |
          python3 scripts/slopcheck.py examples/sloppy.txt > /tmp/sloppy.out || test $? -eq 1
          grep -q "delve" /tmp/sloppy.out && echo "sloppy example: caught"

      - name: slopcheck passes clean example
        run: |
          python3 scripts/slopcheck.py examples/clean.txt
          echo "clean example: clean"
